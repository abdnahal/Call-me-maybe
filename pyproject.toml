[project]
name = "call-me-maybe"
version = "1.0.1"
description = "A function calling program that interacts with an llm"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.3",
    "pydantic>=2.12.5",
    "torch>=2.12.0", 
    "transformers>=5.12.0"
]
[tool.mypy]
warn_unused_ignores = false
disable_error_code = ["assignment", "arg-type"]
